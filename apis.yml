aid: nabla-bio
name: Nabla Bio
description: 'Nabla Bio is a Cambridge, Massachusetts biotechnology company founded
  in 2021 as a Harvard spinout, building generative protein design systems for de novo
  biologics discovery. Its platform is JAM (Joint Atomic Modeling), a multimodal generative
  model trained on large-scale protein sequence and structure data that takes partial
  molecular context — a disease target or an epitope — and computationally designs
  the rest, producing de novo antibodies, VHH-Fc and full-length mAb formats, epitope
  scaffolds, cytokines, receptor traps and multi-domain multispecifics. The company
  pairs the model with an integrated wet lab that feeds mammalian, cellular and in
  vivo measurements back into training, and has published work on de novo design of
  GPCR-targeting antibodies against CXCR4 and CXCR7. Nabla Bio engages exclusively
  through pharmaceutical partnership and molecule licensing — with AstraZeneca, Bristol
  Myers Squibb and Takeda — and does not operate a public developer program, API, SDK
  or self-serve platform.'
